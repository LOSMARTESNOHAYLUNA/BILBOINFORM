  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --naranja: #F76205;
      --naranja-oscuro: #C84D00;
      --naranja-claro: #FF8B3A;
      --negro: #0F0F0F;
      --gris-oscuro: #1F1F1F;
      --gris: #444;
      --gris-claro: #777;
      --crema: #FFF8F1;
      --blanco: #FFFFFF;
      --sombra: 0 10px 40px rgba(15,15,15,0.08);
      --sombra-fuerte: 0 20px 60px rgba(247,98,5,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Manrope', -apple-system, sans-serif;
      color: var(--negro);
      background: var(--blanco);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Playfair Display', Georgia, serif;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ============ HERO ============ */
    .hero {
      background: linear-gradient(135deg, #C84D00 0%, #F76205 50%, #FF8B3A 100%);
      color: var(--blanco);
      padding: 100px 24px 80px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    .hero-logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }

    .logo-box {
      background: var(--blanco);
      padding: 16px 28px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      min-height: 64px;
    }

    .logo-box img {
      max-height: 36px;
      width: auto;
    }

    .logo-box.placeholder {
      color: var(--naranja);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5.5vw, 4.2rem);
      font-weight: 700;
      margin-bottom: 32px;
      max-width: 950px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero h1 em {
      font-style: italic;
      color: #FFE4D1;
    }

    .hero-sub {
      font-size: clamp(1.05rem, 1.8vw, 1.3rem);
      max-width: 760px;
      margin: 0 auto 24px;
      opacity: 0.95;
      font-weight: 400;
    }

    .hero-sub strong {
      font-weight: 700;
      color: #FFF;
      display: block;
      margin-top: 12px;
      font-size: 1.1em;
    }

    .hero-datos {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin: 40px 0;
      flex-wrap: wrap;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .hero-datos span {
      background: rgba(255,255,255,0.15);
      padding: 12px 24px;
      border-radius: 100px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
    }

    .cta-principal {
      display: inline-block;
      background: var(--blanco);
      color: var(--naranja);
      padding: 20px 48px;
      border-radius: 100px;
      font-size: 1.15rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      letter-spacing: 0.3px;
    }

    .cta-principal:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 50px rgba(0,0,0,0.3);
    }

    .hero-precios {
      margin-top: 28px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .hero-precios span {
      display: inline-block;
      margin: 4px 12px;
    }

    /* ============ SECCIÓN POR QUÉ ============ */
    section {
      padding: 90px 24px;
    }

    .section-titulo {
      text-align: center;
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 700;
      margin-bottom: 48px;
      color: var(--negro);
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .section-titulo em {
      color: var(--naranja);
      font-style: italic;
    }

    .porque {
      background: var(--crema);
    }

    .porque-grid {
      max-width: 1000px;
      margin: 0 auto;
    }

    .porque-texto {
      font-size: 1.1rem;
      color: var(--gris);
      margin-bottom: 32px;
      text-align: center;
    }

    .lista-iconos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 40px 0;
      list-style: none;
    }

    .lista-iconos li {
      background: var(--blanco);
      padding: 20px 24px;
      border-radius: 12px;
      font-weight: 600;
      color: var(--negro);
      border-left: 4px solid var(--naranja);
      box-shadow: var(--sombra);
    }

    .impacto {
      background: var(--negro);
      color: var(--blanco);
      padding: 40px;
      border-radius: 20px;
      margin-top: 40px;
      text-align: center;
    }

    .impacto h3 {
      color: var(--naranja-claro);
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    .impacto ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .impacto li {
      padding: 10px 20px;
      background: rgba(255,255,255,0.08);
      border-radius: 100px;
      font-weight: 500;
    }

    .union-frase {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
      margin-top: 40px;
      color: var(--negro);
    }

    .union-frase strong {
      color: var(--naranja);
      font-size: 1.4rem;
      display: block;
      margin-top: 12px;
    }

    /* ============ PONENCIAS ============ */
    .ponencia {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .ponencia.reverse {
      direction: rtl;
    }

    .ponencia.reverse > * {
      direction: ltr;
    }

    .ponencia-foto {
      aspect-ratio: 4/5;
      background: linear-gradient(135deg, var(--naranja) 0%, var(--naranja-oscuro) 100%);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: var(--sombra-fuerte);
    }

    .ponencia-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ponencia-foto.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blanco);
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      padding: 24px;
    }

    .ponencia-contenido h3 {
      font-size: clamp(2rem, 3.5vw, 3rem);
      margin-bottom: 8px;
      color: var(--negro);
    }

    .ponencia-rol {
      color: var(--gris-claro);
      font-size: 1rem;
      margin-bottom: 24px;
      font-family: 'Manrope', sans-serif;
      font-weight: 500;
    }

    .ponencia-rol a {
      color: var(--naranja);
      text-decoration: none;
      font-weight: 600;
    }

    .ponencia-rol a:hover {
      text-decoration: underline;
    }

    .ponencia-titular {
      font-size: clamp(1.3rem, 2.2vw, 1.7rem);
      font-style: italic;
      color: var(--naranja);
      margin-bottom: 28px;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      line-height: 1.3;
      border-left: 4px solid var(--naranja);
      padding-left: 20px;
    }

    .ponencia-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .ponencia-tags span {
      background: var(--crema);
      color: var(--naranja-oscuro);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .ponencia-contenido p {
      color: var(--gris);
      margin-bottom: 16px;
      font-size: 1.05rem;
    }

    .ponencia-contenido ul {
      list-style: none;
      margin-top: 24px;
    }

    .ponencia-contenido ul li {
      padding: 10px 0 10px 32px;
      position: relative;
      font-weight: 500;
      color: var(--negro);
    }

    .ponencia-contenido ul li::before {
      content: '✔';
      position: absolute;
      left: 0;
      color: var(--naranja);
      font-weight: 800;
      font-size: 1.1rem;
    }

    /* ============ EXPERIENCIA ============ */
    .experiencia {
      background: var(--crema);
    }

    .experiencia-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .exp-card {
      background: var(--blanco);
      padding: 36px 28px;
      border-radius: 18px;
      text-align: center;
      box-shadow: var(--sombra);
      transition: transform 0.3s ease;
    }

    .exp-card:hover {
      transform: translateY(-6px);
    }

    .exp-card .icono {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }

    .exp-card h4 {
      font-family: 'Manrope', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--negro);
    }

    .exp-card p {
      color: var(--gris);
      font-size: 0.95rem;
    }

    /* ============ PARA QUIÉN ============ */
    .para-quien {
      background: var(--blanco);
    }

    .para-quien-lista {
      max-width: 720px;
      margin: 0 auto;
      list-style: none;
    }

    .para-quien-lista li {
      padding: 18px 24px 18px 56px;
      position: relative;
      font-size: 1.1rem;
      font-weight: 500;
      border-bottom: 1px solid #EEE;
    }

    .para-quien-lista li::before {
      content: '✔';
      position: absolute;
      left: 20px;
      top: 18px;
      color: var(--naranja);
      font-weight: 800;
      font-size: 1.2rem;
    }

    .para-quien-lista li:last-child {
      border-bottom: none;
    }

    /* ============ ENTRADAS ============ */
    .entradas {
      background: linear-gradient(180deg, var(--crema) 0%, var(--blanco) 100%);
    }

    .entradas-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      max-width: 900px;
      margin: 0 auto;
    }

    .entrada-card {
      background: var(--blanco);
      border-radius: 24px;
      padding: 48px 36px;
      box-shadow: var(--sombra);
      border: 2px solid transparent;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .entrada-card.destacada {
      border-color: var(--naranja);
      transform: scale(1.02);
    }

    .entrada-card:hover {
      transform: translateY(-4px);
    }

    .entrada-card.destacada:hover {
      transform: scale(1.02) translateY(-4px);
    }

    .entrada-badge {
      display: inline-block;
      background: var(--naranja);
      color: var(--blanco);
      padding: 4px 14px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .entrada-card h3 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      color: var(--negro);
    }

    .entrada-precio {
      font-size: 3rem;
      font-weight: 800;
      color: var(--naranja);
      margin: 16px 0 24px;
      font-family: 'Playfair Display', serif;
    }

    .entrada-precio small {
      font-size: 1rem;
      color: var(--gris-claro);
      font-weight: 400;
      font-family: 'Manrope', sans-serif;
    }

    .entrada-incluye {
      list-style: none;
      margin: 0 0 32px;
      flex-grow: 1;
    }

    .entrada-incluye li {
      padding: 8px 0 8px 28px;
      position: relative;
      color: var(--gris);
    }

    .entrada-incluye li::before {
      content: '✔';
      position: absolute;
      left: 0;
      color: var(--naranja);
      font-weight: 800;
    }

    .btn-entrada {
      display: block;
      width: 100%;
      padding: 16px 24px;
      background: var(--naranja);
      color: var(--blanco);
      text-align: center;
      text-decoration: none;
      border-radius: 100px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
    }

    .btn-entrada:hover {
      background: var(--naranja-oscuro);
      transform: translateY(-2px);
    }

    .btn-entrada.secundario {
      background: var(--negro);
    }

    .btn-entrada.secundario:hover {
      background: var(--gris-oscuro);
    }

    .btn-entrada:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ============ FORMULARIO MODAL ============ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,15,15,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }

    .modal-overlay.activo {
      display: flex;
    }

    .modal {
      background: var(--blanco);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-cerrar {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--gris);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-cerrar:hover {
      background: var(--crema);
    }

    .modal h3 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: var(--negro);
    }

    .modal-subtitulo {
      color: var(--gris);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .form-grupo {
      margin-bottom: 18px;
    }

    .form-grupo label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--negro);
    }

    .form-grupo input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #DDD;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .form-grupo input:focus {
      outline: none;
      border-color: var(--naranja);
    }

    .form-mensaje {
      padding: 14px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 0.95rem;
      display: none;
    }

    .form-mensaje.exito {
      background: #E8F5E9;
      color: #2E7D32;
      border-left: 4px solid #2E7D32;
      display: block;
    }

    .form-mensaje.error {
      background: #FFEBEE;
      color: #C62828;
      border-left: 4px solid #C62828;
      display: block;
    }

    /* ============ PRUEBA SOCIAL ============ */
    .prueba-social {
      background: var(--blanco);
    }

    .prueba-social-texto {
      max-width: 760px;
      margin: 0 auto 48px;
      text-align: center;
      font-size: 1.1rem;
      color: var(--gris);
    }

    .prueba-social-texto strong {
      color: var(--naranja);
    }

    .fotos-evento {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .foto-evento {
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, var(--crema) 0%, #FFE4D1 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--naranja);
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      padding: 16px;
    }

    /* ============ CITA POTENTE ============ */
    .cita-bloque {
      background: var(--negro);
      color: var(--blanco);
      padding: 100px 24px;
      text-align: center;
    }

    .cita-bloque blockquote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.6rem, 3.5vw, 2.6rem);
      font-weight: 600;
      line-height: 1.3;
      max-width: 1000px;
      margin: 0 auto 40px;
      color: var(--blanco);
    }

    .cita-bloque blockquote::before {
      content: '"';
      display: block;
